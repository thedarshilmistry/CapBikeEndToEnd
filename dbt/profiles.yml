cp_bikeshare:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5433
      user: bikeshare
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: bikeshare
      schema: public
      threads: 4
    container:
      type: postgres
      host: warehouse
      port: 5432
      user: bikeshare
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: bikeshare
      schema: public
      threads: 4